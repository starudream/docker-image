[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:kasmvnc]
command=vncserver :0 -fg -geometry %(ENV_DISPLAY_WIDTH)sx%(ENV_DISPLAY_HEIGHT)s -depth 24 -xstartup /app/xstartup.sh
priority=10
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:camoufox]
command=python /app/server.py
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
