name: docker-camoufox

permissions:
  packages: write

on:
  workflow_dispatch:
  push: { paths: [ 'camoufox/**', '.github/workflows/camoufox.yml' ] }

jobs:

  camoufox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          username: starudream
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: starudream
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          tags: starudream/camoufox:0.5.8,starudream/camoufox:latest,ghcr.io/starudream/camoufox:0.5.8,ghcr.io/starudream/camoufox:latest
          context: camoufox
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          cache-from: type=gha,scope=${{ github.job }}
          cache-to: type=gha,mode=max,scope=${{ github.job }}
